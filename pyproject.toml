[project]
name = "lora-bench"
version = "0.1.0"
description = "Fine-tuning and inference-cost study: LoRA/QLoRA on CVE fix-diffs, base vs. fine-tuned vs. quantized."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled --dry-run/test sample -- see lora_bench.data.cvefixes._load_fixture_records.
# Packaged (not a tests/ path) so it resolves the same from an editable
# checkout or a real installed wheel; a Path(__file__).resolve().parents[N]
# scheme would break under the latter, since the package would live in
# site-packages with no tests/ directory alongside it.
"lora_bench.data" = ["sample_records.json"]

[tool.pytest.ini_options]
# Lets `pytest` resolve `import lora_bench...` even without the package
# installed — repo-side code must be runnable/testable outside Colab with
# nothing more than requirements-repo.txt installed. Running the CLI
# directly (`python -m lora_bench...`) instead of via pytest still needs
# either `pip install -e .` or `PYTHONPATH=src`; see README.md.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: hits a live external service (e.g. the HF Hub); skipped by default and in CI",
]
addopts = "-m 'not network'"
